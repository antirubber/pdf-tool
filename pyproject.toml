[project]
name = "pdf-tool"
version = "0.0.1"
description = "Interactive wizard CLI for everyday PDF manipulation."
requires-python = ">=3.12"
dependencies = [
    "pikepdf>=9",
    "questionary>=2",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
pdf-tool = "pdf_tool.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external binaries on the runner",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pdf_tool"]
