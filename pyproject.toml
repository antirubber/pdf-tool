[project]
name = "pdf-tool"
dynamic = ["version"]
description = "Interactive wizard CLI for everyday PDF manipulation."
requires-python = ">=3.12"
dependencies = [
    "pikepdf>=9",
    "questionary>=2",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
pdf-tool = "pdf_tool.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require external binaries on the runner",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: __version__ in pdf_tool/__init__.py.
# The release script bumps only that line; package metadata is read from it.
[tool.hatch.version]
path = "pdf_tool/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pdf_tool"]
